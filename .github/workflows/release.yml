name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.5.1, v2.0.0, etc.

permissions:
  contents: write

env:
  PLUGIN_SLUG: simple-shibboleth
  PLUGIN_VERSION_CONST: SIMPLE_SHIBBOLETH_VERSION

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Resolve version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        
    - name: Verify tag matches plugin version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
          constant=$(grep -m1 -oP "define\(\s*'$PLUGIN_VERSION_CONST',\s*'\K[^']+" "$PLUGIN_SLUG.php")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "Tag: $VERSION | Header: $header | $PLUGIN_VERSION_CONST: $constant | Stable tag: $stable"
          status=0
          for v in "$header" "$constant" "$stable"; do
            if [ "$v" != "$VERSION" ]; then status=1; fi
          done
          if [ $status -ne 0 ]; then
            echo "::error::Tag version $VERSION does not match the version in the plugin header, $PLUGIN_VERSION_CONST, or readme.txt Stable tag."
          fi
          exit $status

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
        coverage: none

    - name: Install Composer dependencies
      run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

    - name: Lint PHP
      run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
        
    - name: Build plugin zip
      run: |
          mkdir -p build/"$PLUGIN_SLUG"
          rsync -a --exclude-from=.distignore --exclude=build ./ build/"$PLUGIN_SLUG"/
          cd build
          zip -r "$PLUGIN_SLUG.zip" "$PLUGIN_SLUG"
          unzip -l "$PLUGIN_SLUG.zip"
        
    - name: Write Release Notes
      env:
          VERSION: ${{ steps.version.outputs.version }}
      run: |
        requires_wp=$(grep -m1 -E '^\s*\*\s*Requires at least:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
        requires_php=$(grep -m1 -E '^\s*\*\s*Requires PHP:' "$PLUGIN_SLUG.php" | awk '{print $NF}')
        cat > build/release-notes.md <<EOF
        ## Requirements

        - WordPress ${requires_wp} or later
        - PHP ${requires_php} or later
        - Shibboleth SP configured with Apache `mod_shib`
        
        ## Manual Installation

        1. Download the **\`${PLUGIN_SLUG}.zip\`** from the Assets section below. (Don't use the "Source code" archives; they don't include the required \`vendor/\` dependencies.)
        2. In WordPress, go to **Plugins → Add New Plugin → Upload Plugin**, choose the zip, and click **Install Now**.
        3. Activate the plugin

        ## WP-CLI Installation

        ```bash
        wp plugin install --activate https://github.com/joshmckibbin/SimpleShibboleth/releases/download/v${{ steps.version.outputs.version }}/$PLUGIN_SLUG.zip
        ```

        ## Updating

        Once installed, WordPress picks up new releases from this repository automatically and offers them under **Dashboard → Updates**. To update manually, upload the new zip the same way and choose **Replace current with uploaded**.

        ## Configuration

        Go to **Settings → Simple Shibboleth** to configure the plugin settings.

        **Note:** This plugin requires a properly configured Shibboleth IdP and SP. See the [installation instructions](https://github.com/joshmckibbin/SimpleShibboleth#installation) for details.
        
        EOF
        cat build/release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
          name: ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: build/${{ env.PLUGIN_SLUG }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

